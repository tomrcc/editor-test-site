# Test harness config. Each block is tagged with the test in TESTING.md it exists for.

timezone: Etc/UTC

data_config:
  params: # T-PARAMS: lets @data[params] regions bind the config file
    path: config/_default/params.yaml
  langconfig: # T-PARAMS P3: a config file in data_config only, in no collection
    path: config/_default/languages.yaml
  tags: # T-TAXONOMY
    path: data/tags.yaml
  colors: # T-SELECT-CONVENTION
    path: data/colors.yaml

collections_config:
  pages:
    path: content
    glob:
      - "*.md"
    url: /[full_slug]/
    name: Pages
    icon: description
    disable_add_folder: true
    create:
      path: "[relative_base_path]/{title|slugify}.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/page.md
        name: Page
      home:
        path: .cloudcannon/schemas/home.md
        name: Home
    add_options:
      - name: Page
        schema: default
    _inputs:
      "menu.main.weight": # T-NESTED-INPUTS: does a dotted key match menu.main.weight?
        type: number
        label: Menu order (DOTTED _inputs key)
      weight: # T-NESTED-INPUTS: or does the plain key match it?
        type: number
        label: Menu order (PLAIN _inputs key)

  posts:
    path: content/posts
    glob:
      - "**/index.md"
      - "_index.md"
    url: /posts/[full_slug]/
    name: Posts
    icon: article
    disable_add_folder: true
    create: # T-CREATE: new posts should be bundles
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post.md
        name: Post
      list:
        path: .cloudcannon/schemas/page.md
        name: List page
    add_options:
      - name: Post
        schema: default
    _inputs:
      date: # T-CREATE: the NOW value's format decides whether T-DATES breaks the editor
        type: datetime
        instance_value: NOW
      image: # T-UPLOAD: cover.image uploads into the post's bundle
        type: image
        label: Cover image
        options:
          paths:
            uploads: content/posts/[relative_base_path]
            static: ""
            uploads_use_relative_path: true

  image_regions: # T-IMAGE-STATIC: one image input per variant; each pair differs only in paths.static
    path: content/image-regions
    glob:
      - "**/index.md"
      - "_index.md" # the list page holds the L-variants
    url: /image-regions/[full_slug]/
    name: Image regions
    icon: image
    disable_add: true
    _inputs:
      s0:
        type: image
        label: S0 static/ (positive control)
        options:
          paths:
            uploads: static/image-regions
            static: static
      a0:
        type: image
        label: A0 assets/, no static (control)
        options:
          paths:
            uploads: assets/test-images
      a1:
        type: image
        label: "A1 assets/, static: assets"
        options:
          paths:
            uploads: assets/test-images
            static: assets
      b0:
        type: image
        label: 'B0 bundle, static: "" (control)'
        options:
          paths:
            uploads: content/image-regions/[full_slug]/
            static: ""
            uploads_use_relative_path: true
      b1:
        type: image
        label: "B1 bundle, static: content/image-regions/[full_slug]/"
        options:
          paths:
            uploads: content/image-regions/[full_slug]/
            static: content/image-regions/[full_slug]/
            uploads_use_relative_path: true

  posts_b: # H6 variant B: like posts, but NO add_options. Isolates add_options vs create.path
    path: content/posts-b
    glob:
      - "**/index.md"
    url: /posts-b/[full_slug]/
    name: Posts B (no add_options)
    icon: article
    disable_add_folder: true
    create:
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post.md
        name: Post
    _inputs:
      date:
        type: datetime
        instance_value: NOW
      image:
        type: image
        label: Cover image
        options:
          paths:
            uploads: content/posts-b/[relative_base_path]
            static: ""
            uploads_use_relative_path: true

  posts_c: # H6 variant C: no add_options, and the schema has NO date key. Isolates schema date vs instance_value
    path: content/posts-c
    glob:
      - "**/index.md"
    url: /posts-c/[full_slug]/
    name: Posts C (no add_options, no date in schema)
    icon: article
    disable_add_folder: true
    create:
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post-no-date.md
        name: Post
    _inputs:
      date:
        type: datetime
        instance_value: NOW
      image:
        type: image
        label: Cover image
        options:
          paths:
            uploads: content/posts-c/[relative_base_path]
            static: ""
            uploads_use_relative_path: true

  posts_d: # H6 variant D: no add_options and NO disable_add_folder. Also tests instance_value on other keys
    path: content/posts-d
    glob:
      - "**/index.md"
    url: /posts-d/[full_slug]/
    name: Posts D (no disable_add_folder)
    icon: article
    create:
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post-d.md
        name: Post
    _inputs:
      date:
        type: datetime
        instance_value: NOW
      published_at: # Same as date under another key: is `date` special?
        type: datetime
        instance_value: NOW
      uid: # Does instance_value work at all in this flow?
        type: text
        instance_value: UUID
      image:
        type: image
        label: Cover image
        options:
          paths:
            uploads: content/posts-d/[relative_base_path]
            static: ""
            uploads_use_relative_path: true

  posts_e: # H6 variant E: create and _inputs set on the SCHEMA entry, not the collection
    path: content/posts-e
    glob: # Wide on purpose: flat files must show up, so a failed create.path is visible
      - "**/*.md"
      - "!_index.md"
    url: /posts-e/[full_slug]/
    name: Posts E (create + inputs on schema)
    icon: article
    schemas:
      default:
        path: .cloudcannon/schemas/post-d.md
        name: Post
        create:
          path: "[relative_base_path]/{title|slugify}/index.[ext]"
        _inputs:
          date:
            type: datetime
            instance_value: NOW
          published_at:
            type: datetime
            instance_value: NOW
          uid:
            type: text
            instance_value: UUID
          image:
            type: image
            label: Cover image (schema-level input)
            options:
              paths:
                uploads: content/posts-e/[relative_base_path]
                static: ""
                uploads_use_relative_path: true

  posts_f: # H6 variant F: exactly D (create + inputs on the COLLECTION), but with E's wide glob. Isolates glob vs schema-level
    path: content/posts-f
    glob:
      - "**/*.md"
      - "!_index.md"
    url: /posts-f/[full_slug]/
    name: Posts F (collection-level, wide glob)
    icon: article
    create:
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post-d.md
        name: Post
    _inputs:
      date:
        type: datetime
        instance_value: NOW
      published_at:
        type: datetime
        instance_value: NOW
      uid:
        type: text
        instance_value: UUID
      image:
        type: image
        label: Cover image (collection-level input)
        options:
          paths:
            uploads: content/posts-f/[relative_base_path]
            static: ""
            uploads_use_relative_path: true

  posts_g: # H6 variant G: exactly F (working glob) plus disable_add_folder. Does it block create.path's folder?
    path: content/posts-g
    glob:
      - "**/*.md"
      - "!_index.md"
    url: /posts-g/[full_slug]/
    name: Posts G (wide glob + disable_add_folder)
    icon: article
    disable_add_folder: true
    create:
      path: "[relative_base_path]/{title|slugify}/index.[ext]"
    schemas:
      default:
        path: .cloudcannon/schemas/post-d.md
        name: Post
    _inputs:
      date:
        type: datetime
        instance_value: NOW
      uid:
        type: text
        instance_value: UUID

  settings: # T-DEVFILES and T-PARAMS: with include_developer_files
    path: config/_default
    glob:
      - params.yaml
    name: Site settings
    icon: settings
    include_developer_files: true
    _enabled_editors:
      - data
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

  settings_menus: # T-PARAMS P2: a config file in a collection only, not in data_config
    path: config/_default
    glob:
      - menus.yaml
    name: Menus (collection only)
    icon: menu
    include_developer_files: true
    _enabled_editors:
      - data
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

  settings_no_devfiles: # T-DEVFILES: a different config file, without include_developer_files. Expected empty when hosted
    # A file belongs to one collection only, so no two collection globs may match the same file.
    path: config/_default
    glob:
      - markup.yaml
    name: Site settings (no include_developer_files)
    icon: settings_alert
    _enabled_editors:
      - data
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

  site_data: # T-TAXONOMY
    path: data
    glob:
      - tags.yaml
      - colors.yaml
    name: Site data
    icon: dataset
    _enabled_editors:
      - data
    disable_url: true
    disable_add: true
    disable_add_folder: true
    disable_file_actions: true

collection_groups:
  - heading: Content
    collections:
      - pages
      - posts
      - posts_b
      - posts_c
      - posts_d
      - posts_e
      - posts_f
      - posts_g
      - image_regions
  - heading: Site
    collections:
      - settings
      - settings_menus
      - settings_no_devfiles
      - site_data

file_config:
  - glob: config/_default/params.yaml
    _inputs:
      env:
        hidden: true
      defaultTheme:
        hidden: true
      ShowReadingTime:
        hidden: true
      intro_title:
        type: text
        label: Intro title (T-PARAMS)
      intro_text:
        type: text
        label: Intro text (T-PARAMS)
      links: # T-SINGLEKEY
        type: array
        label: Links (single-key maps)
        options:
          structures: _structures.single_key_links
  - glob: config/_default/menus.yaml
    _inputs:
      main:
        type: array
        label: Main menu
      pageRef:
        type: text
        label: Page
  - glob: data/tags.yaml # T-TAXONOMY: root array of strings
    _inputs:
      $:
        type: array
        label: Tags
      $[*]:
        type: text
        label: Tag
  - glob: data/colors.yaml
    _inputs:
      $:
        type: array
        label: Colours
      $[*]:
        type: text
        label: Colour

_editables: # T-EDITABLES-FALLBACK: distinctive fallback toolbars, so you can tell where a toolbar came from
  text: # ONLY bold + superscript
    bold: true
    superscript: true
  block: # ONLY bold + blockquote + format p/h5
    bold: true
    blockquote: true
    format: p h5

_inputs:
  # T-EDITABLES-FALLBACK: V1 (fb1_*) has no _inputs entry on purpose
  fb2_text: # V2: type only
    type: markdown
  fb2_block:
    type: markdown
  fb3_text: # V3: type + label + comment, still no options
    type: markdown
    label: V3 text (label + comment, no options)
    comment: This comment and label should not block the _editables fallback.
  fb3_block:
    type: markdown
    label: V3 block (label + comment, no options)
    comment: This comment and label should not block the _editables fallback.
  fb4_text: # V4: own options, ONLY italic + subscript
    type: markdown
    options:
      italic: true
      subscript: true
  fb4_block: # V4: own options, ONLY italic + numbered list + format p/h6
    type: markdown
    options:
      italic: true
      numberedlist: true
      format: p h6
  tags: # T-TAXONOMY
    type: multiselect
    comment: Manage the list under Site data → Tags.
    options:
      values: data.tags
      allow_create: true
  my_colors: # T-SELECT-CONVENTION: no values on purpose. Does it pick up the colors data set by name?
    type: select
    label: Colour (no values configured)
  _name:
    hidden: true
  faq_question:
    type: text
  faq_answer:
    type: text
  button_text:
    type: text
  caption:
    type: text
  buttons: # T-ARRAY-WRAPPER
    type: array
    options:
      structures: _structures.buttons
  content_blocks: # T-BLOCKS
    type: array
    options:
      structures: _structures.content_blocks
  items:
    type: array
    options:
      structures: _structures.stat_items
  icon:
    type: select
    options:
      values:
        - star
        - arrow

_structures:
  single_key_links: # T-SINGLEKEY: one value per key name
    values:
      - label: GitHub
        icon: code
        preview:
          text:
            - key: github
            - GitHub
        value:
          github:
        _inputs:
          github:
            type: url
      - label: Email
        icon: mail
        preview:
          text:
            - key: email
            - Email
        value:
          email:
        _inputs:
          email:
            type: email
  buttons:
    values:
      - label: Button
        icon: ads_click
        preview:
          text:
            - key: label
            - Button
        value:
          label:
          url:
          icon: star
  content_blocks:
    id_key: _name
    values:
      - label: Text block
        icon: notes
        preview:
          text:
            - key: text
            - Text block
        value:
          _name: blocks/text
          text:
        _inputs:
          text:
            type: markdown
      - label: Stats block
        icon: bar_chart
        preview:
          text:
            - key: heading
            - Stats block
        value:
          _name: blocks/stats
          heading:
          items: []
  stat_items:
    values:
      - label: Stat
        icon: numbers
        preview:
          text:
            - key: label
            - Stat
        value:
          value:
          label:
        _inputs:
          value:
            type: text

_snippets_imports:
  hugo: true

_snippets:
  badge: # T-SNIPPET-NOARGS
    template: hugo_paired_shortcode_named_args
    inline: true
    preview:
      text:
        - key: text
        - Badge
      icon: label
    definitions:
      shortcode_name: badge
      content_key: text
      named_args: []
    _inputs:
      text:
        type: text

  collapse: # T-SNIPPET-BOOL: the theme compares openByDefault with a real boolean
    template: hugo_paired_shortcode_named_args
    inline: false
    preview:
      text:
        - key: summary
        - Collapse
      icon: unfold_more
    definitions:
      shortcode_name: collapse
      content_key: inner
      named_args:
        - editor_key: summary
          type: string
        - editor_key: openByDefault
          type: boolean
          optional: true
          remove_empty: true
    _inputs:
      openByDefault:
        type: switch
      inner:
        type: markdown

  stats: # T-SNIPPET-REPEATING: parent/child shortcodes
    snippet: "{{< stats >}}[[stat_items]]{{< /stats >}}"
    inline: false
    preview:
      text: Stats
      icon: bar_chart
    params:
      stat_items:
        parser: repeating
        options:
          snippet: "{{< stat [[stat_args]] >}}[[stat_text]]{{< /stat >}}"
          editor_key: stats
          default_length: 1
          style:
            output: block
            between: "\n"
            block:
              leading: "\n"
              trailing: "\n"
      stat_args:
        parser: key_values
        options:
          models:
            - editor_key: value
              type: string
          format:
            root_value_delimiter: "="
            root_pair_delimiter:
              - " "
            string_boundary:
              - '"'
      stat_text:
        parser: content
        options:
          editor_key: text
          trim_text: true
    _inputs:
      stats:
        type: array
        options:
          structures: _structures.snippet_stats
      value:
        type: text
      text:
        type: text
    _structures:
      snippet_stats:
        values:
          - label: Stat
            value:
              value:
              text:
